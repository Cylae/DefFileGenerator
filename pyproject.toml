[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "def-file-generator"
version = "0.1.0"
description = "Extract Modbus register maps and generate WebdynSunPM definition CSV files."
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
authors = [{name = "Cylae"}]
dependencies = [
  "defusedxml>=0.7",
  "lxml>=4.9",
  "openpyxl>=3.1",
  "pdfplumber>=0.10",
]

[project.optional-dependencies]
dev = [
  "pytest>=8",
  "pytest-cov>=5",
  "ruff>=0.6",
]

[tool.setuptools.packages.find]
include = ["DefFileGenerator*"]

[tool.pytest.ini_options]
testpaths = ["DefFileGenerator/tests"]
addopts = "-ra"

[tool.ruff]
target-version = "py39"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.coverage.run]
source = ["DefFileGenerator"]
branch = true

[tool.coverage.report]
show_missing = true

[tool.coverage.html]
directory = "htmlcov"

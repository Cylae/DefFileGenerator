[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "def-file-generator"
version = "0.2.1"
description = "Extract Modbus register maps and generate WebdynSunPM definition CSV files."
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
authors = [{name = "Cylae"}]
dependencies = [
  "defusedxml>=0.7",
  "lxml>=4.9",
  "openpyxl>=3.1",
  "pdfplumber>=0.10",
]

[project.optional-dependencies]
dev = [
  "pytest>=8",
  "pytest-cov>=5",
  "ruff>=0.6",
  "mypy>=1.10",
  "bandit>=1.7",
]

[project.scripts]
deffilegen = "DefFileGenerator.main:main"

[tool.setuptools.packages.find]
include = ["DefFileGenerator*"]

[tool.pytest.ini_options]
testpaths = ["DefFileGenerator/tests"]
addopts = "-ra"

[tool.ruff]
target-version = "py39"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.10"
warn_return_any = false
warn_unused_configs = true
disallow_untyped_defs = false

[[tool.mypy.overrides]]
module = [
  "openpyxl.*",
  "defusedxml.*",
  "pdfplumber.*",
  "pdfminer.*",
  "reportlab.*",
  "pandas.*",
]
ignore_missing_imports = true

[tool.coverage.run]
source = ["DefFileGenerator"]
branch = true

[tool.coverage.report]
show_missing = true

[tool.coverage.html]
directory = "htmlcov"

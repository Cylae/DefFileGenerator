name: Jules Auto-Merge

on:
  workflow_run:
    workflows: [CI]
    types: [completed]

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: jules-auto-merge-${{ github.event.workflow_run.id }}
  cancel-in-progress: false

jobs:
  auto-merge:
    name: Enable automatic merge for validated Jules PRs
    if: ${{ github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'pull_request' }}
    runs-on: ubuntu-latest
    steps:
      - name: Find PR associated with the successful CI run
        id: pr
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
        shell: bash
        run: |
          set -euo pipefail

          prs="$(gh api \
            -H 'Accept: application/vnd.github+json' \
            "/repos/${REPO}/commits/${HEAD_SHA}/pulls" \
            --jq '.[] | select(.base.ref == "main") | [.number, .draft, .body] | @tsv')"

          if [[ -z "$prs" ]]; then
            echo "No main-targeting PR found for CI commit ${HEAD_SHA}."
            exit 0
          fi

          while IFS=$'\t' read -r number draft body; do
            [[ "$draft" == "false" ]] || continue

            # Jules currently identifies its automatically-created PRs with this text.
            # The workflow never checks out or executes code from the PR branch.
            if grep -Fq 'PR created automatically by Jules' <<< "$body"; then
              echo "pr_number=${number}" >> "$GITHUB_OUTPUT"
              echo "Found Jules PR #${number}."
              exit 0
            fi
          done <<< "$prs"

          echo "No qualifying Jules PR found."

      - name: Enable GitHub auto-merge
        if: ${{ steps.pr.outputs.pr_number != '' }}
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ steps.pr.outputs.pr_number }}
        run: |
          set -euo pipefail
          gh pr merge "$PR_NUMBER" \
            --repo "$REPO" \
            --auto \
            --squash \
            --delete-branch

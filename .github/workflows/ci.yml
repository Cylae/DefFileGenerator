name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality-and-tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[dev,web]"
      - name: Lint with Ruff
        run: ruff check .
      - name: Check code formatting with Ruff
        run: ruff format --check .
      - name: Type check with mypy
        run: mypy DefFileGenerator web
      - name: Security audit with bandit
        run: bandit -r DefFileGenerator web -ll
      - name: Verify CLI entry point
        run: deffilegen --version
      - name: Verify wheel contains the web application
        if: matrix.python-version == '3.10'
        shell: bash
        run: |
          rm -rf dist
          python -m pip wheel . --no-deps --wheel-dir dist
          python - <<'PY'
          import glob
          import zipfile

          wheels = glob.glob("dist/*.whl")
          if len(wheels) != 1:
              raise SystemExit(f"Expected exactly one wheel, found: {wheels}")

          required = {
              "web/__init__.py",
              "web/app.py",
              "web/static/app.js",
              "web/static/index.html",
              "web/static/styles.css",
          }
          with zipfile.ZipFile(wheels[0]) as archive:
              missing = sorted(required.difference(archive.namelist()))
          if missing:
              raise SystemExit(f"Wheel is missing web runtime files: {missing}")
          PY
      - name: Run tests and publish coverage baseline
        run: python -m pytest --cov=DefFileGenerator --cov=web --cov-report=term-missing --cov-report=xml
      - name: Upload coverage artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-py${{ matrix.python-version }}
          path: coverage.xml
          if-no-files-found: ignore

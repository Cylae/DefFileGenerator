name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality-and-tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[dev]"
      - name: Lint with Ruff
        run: ruff check .
      - name: Check code formatting with Ruff
        run: ruff format --check .
      - name: Type check with mypy
        run: mypy DefFileGenerator
      - name: Security audit with bandit
        run: bandit -r DefFileGenerator -ll
      - name: Verify CLI entry point
        run: deffilegen --version
      - name: Run tests and publish coverage baseline
        run: python -m pytest --cov=DefFileGenerator --cov-report=term-missing --cov-report=xml
      - name: Upload coverage artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-py${{ matrix.python-version }}
          path: coverage.xml
          if-no-files-found: ignore
